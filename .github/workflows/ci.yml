name: CI Automacao

on:
  push:
    branches: [ main, master, integration ]
  pull_request:
    branches: [ main, master, integration ]

jobs:
  robot-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      EXECUCAO: browserstack
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_APP_URL: ${{ secrets.BS_APP_URL }}
      BS_BUILD_NAME: ${{ github.workflow }}-${{ github.run_number }}
      BS_LOCAL: "true"
      BROWSERSTACK_LOCAL_IDENTIFIER: gh-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar estrutura do projeto
        run: |
          python - <<'PY'
          import os
          required = ['config', 'resources', 'tests']
          missing = [p for p in required if not os.path.exists(p)]
          if missing:
              raise SystemExit(f'Pastas ausentes: {missing}')
          print('Estrutura base OK')
          PY

      - name: Iniciar túnel BrowserStack Local
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: start
          local-identifier: ${{ env.BROWSERSTACK_LOCAL_IDENTIFIER }}
          local-args: --force-local
        env:
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          

      - name: Testar acesso ao backend a partir do runner
        run: |
          echo "IP do runner:"; curl -s https://ifconfig.me; echo
          curl -sS -o /dev/null -m 15 -w "HTTP %{http_code} em %{time_total}s\n" "${{ secrets.BACKEND_URL }}" || echo "SEM RESPOSTA"

      - name: Parar túnel BrowserStack Local
        if: always()
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: stop

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
