name: CI Automacao

on:
  push:
    branches: [ main, master, integration ]
  pull_request:
    branches: [ main, master, integration ]

jobs:
  robot-tests:
    runs-on: self-hosted
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar cache local do Python
        run: mkdir -p "${RUNNER_TEMP}/toolcache"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/toolcache
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar estrutura do projeto
        run: |
          python - <<'PY'
          import os
          required = ['config', 'resources', 'tests']
          missing = [p for p in required if not os.path.exists(p)]
          if missing:
              raise SystemExit(f'Pastas ausentes: {missing}')
          print('Estrutura base OK')
          PY

      - name: Iniciar túnel BrowserStack Local
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: start
          local-logging-level: network-logs
          local-identifier: random
          local-args: --force-local
        env:
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          

      - name: Executar login no BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BS_APP_URL: ${{ secrets.BS_APP_URL }}
          BS_BUILD_NAME: ${{ github.workflow }}-${{ github.run_number }}
          BS_GPS_LOCATION: "-7.0769,-41.4672"
        run: |
          : "${BROWSERSTACK_USERNAME:?Configure o secret BROWSERSTACK_USERNAME}"
          : "${BROWSERSTACK_ACCESS_KEY:?Configure o secret BROWSERSTACK_ACCESS_KEY}"
          : "${BS_APP_URL:?Configure o secret BS_APP_URL}"
          export BROWSERSTACK_USERNAME BROWSERSTACK_ACCESS_KEY BS_APP_URL
          export EXECUCAO=browserstack
          export BS_LOCAL=true
          python -m robot -d results tests/mobile/Autenticacao/login.robot

      - name: Parar túnel BrowserStack Local
        if: always()
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: stop
          local-logging-level: network-logs
        env:
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
