name: CI Automacao

on:
  push:
    branches: [ main, master, integration ]
  pull_request:
    branches: [ main, master, integration ]
  workflow_dispatch:
    inputs:
      bs_device:
        description: "Dispositivo do BrowserStack (ex.: Samsung Galaxy S23, Google Pixel 8)"
        required: false
        default: "Samsung Galaxy S23"
      bs_os_version:
        description: "Versão do Android (ex.: 13.0, 14.0)"
        required: false
        default: "13.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot-tests:
    runs-on: self-hosted
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      BS_LOCAL_IDENTIFIER: ci-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_NAME: ${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
      BS_SESSION_NAME: login-${{ github.run_id }}-${{ github.run_attempt }}
      # Pasta/arquivo de testes passado ao Robot (ajuste se quiser rodar só uma suíte)
      ROBOT_SUITE: tests/e2e/Tests/vistoria_e2e.robot

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar Python
        run: |
          python3 --version
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar estrutura do projeto
        run: |
          python - <<'PY'
          import os
          required = ['config', 'resources', 'tests']
          missing = [p for p in required if not os.path.exists(p)]
          if missing:
              raise SystemExit(f'Pastas ausentes: {missing}')
          print('Estrutura base OK')
          PY

      # config/secrets.yaml está fora do git; aqui ele é gerado a partir dos secrets.
      # AJUSTE os nomes das chaves para os que o seu aprovar_transacao.resource espera.
      - name: Gerar config/secrets.yaml
        env:
          WEB_USERNAME: ${{ secrets.WEB_USERNAME }}
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
        run: |
          set -euo pipefail
          : "${WEB_USERNAME:?Configure o secret WEB_USERNAME}"
          : "${WEB_PASSWORD:?Configure o secret WEB_PASSWORD}"
          mkdir -p config
          python - <<'PY'
          import json, os
          dados = {
              "web_login": {
                  "username": os.environ["WEB_USERNAME"],
                  "password": os.environ["WEB_PASSWORD"],
              }
          }
          # JSON é YAML válido e escapa caracteres especiais (como !!) com segurança
          with open("config/secrets.yaml", "w", encoding="utf-8") as f:
              json.dump(dados, f, ensure_ascii=False, indent=2)
          print("config/secrets.yaml gerado.")
          PY

      - name: Diagnóstico de rede do runner
        continue-on-error: true
        env:
          BR_PROXY_HOST: ${{ secrets.BR_PROXY_HOST }}
        run: |
          echo "IP, país e organização de saída do runner:"
          curl -s --max-time 15 https://ipinfo.io/json || echo "Falha ao consultar ipinfo.io"
          echo
          if [[ -n "${BR_PROXY_HOST:-}" ]]; then
            echo "Proxy BR configurado: o túnel vai sair por ele."
          else
            echo "Sem proxy BR: o túnel vai sair pelo IP do runner."
          fi

      - name: Instalar BrowserStack Local
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/browserstack-local"
          archive="$RUNNER_TEMP/browserstack-local.zip"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            https://www.browserstack.com/browserstack-local/BrowserStackLocal-darwin-x64.zip \
            --output "$archive"
          unzip -o "$archive" -d "$install_dir"
          chmod +x "$install_dir/BrowserStackLocal"

      - name: Iniciar túnel BrowserStack Local
        run: |
          set -euo pipefail
          : "${BROWSERSTACK_ACCESS_KEY:?Configure o secret BROWSERSTACK_ACCESS_KEY}"
          tunnel="$RUNNER_TEMP/browserstack-local/BrowserStackLocal"
          log_file="$RUNNER_TEMP/browserstack-local.log"
          pid_file="$RUNNER_TEMP/browserstack-local.pid"

          if [[ ! -x "$tunnel" ]]; then
            echo "BrowserStackLocal não encontrado ou sem permissão de execução: $tunnel" >&2
            exit 1
          fi

          args=(
            --key "$BROWSERSTACK_ACCESS_KEY"
            --local-identifier "$BS_LOCAL_IDENTIFIER"
            --force-local
            --verbose 1
          )

          # Proxy brasileiro opcional (só se os secrets existirem)
          if [[ -n "${BR_PROXY_HOST:-}" && -n "${BR_PROXY_PORT:-}" ]]; then
            args+=(--local-proxy-host "$BR_PROXY_HOST" --local-proxy-port "$BR_PROXY_PORT")
            if [[ -n "${BR_PROXY_USER:-}" ]]; then
              args+=(--local-proxy-user "$BR_PROXY_USER" --local-proxy-pass "$BR_PROXY_PASS")
            fi
            args+=(--force-proxy)
            echo "Túnel usando proxy BR."
          fi

          "$tunnel" "${args[@]}" >"$log_file" 2>&1 &
          tunnel_pid=$!
          printf '%s\n' "$tunnel_pid" > "$pid_file"

          for attempt in {1..30}; do
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              echo "O processo BrowserStackLocal encerrou antes de conectar." >&2
              tail -n 40 "$log_file" >&2 || true
              exit 1
            fi
            if grep -Fq "You can now access your local" "$log_file"; then
              echo "Túnel BrowserStack Local conectado."
              exit 0
            fi
            sleep 1
          done

          echo "Timeout aguardando a conexão do túnel BrowserStack Local." >&2
          tail -n 40 "$log_file" >&2 || true
          exit 1
        env:
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BR_PROXY_HOST: ${{ secrets.BR_PROXY_HOST }}
          BR_PROXY_PORT: ${{ secrets.BR_PROXY_PORT }}
          BR_PROXY_USER: ${{ secrets.BR_PROXY_USER }}
          BR_PROXY_PASS: ${{ secrets.BR_PROXY_PASS }}

      - name: Upload do vídeo de injeção para o BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          VIDEO_PATH: media/video_injection_bs1.mp4
        run: |
          set -euo pipefail
          : "${BROWSERSTACK_USERNAME:?Configure o secret BROWSERSTACK_USERNAME}"
          : "${BROWSERSTACK_ACCESS_KEY:?Configure o secret BROWSERSTACK_ACCESS_KEY}"

          if [[ ! -f "$VIDEO_PATH" ]]; then
            echo "::error::Vídeo não encontrado: $VIDEO_PATH (ele está commitado?)"
            exit 1
          fi

          # O BrowserStack só aceita .mp4 com menos de 15 MB
          tamanho=$(stat -f%z "$VIDEO_PATH")
          if (( tamanho >= 15 * 1024 * 1024 )); then
            echo "::error::Vídeo com $tamanho bytes; o limite é 15 MB."
            exit 1
          fi

          resposta=$(curl --fail --silent --show-error \
            --user "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload-media" \
            -F "file=@$VIDEO_PATH" \
            -F "custom_id=VideoVistoria")

          media_url=$(jq -r '.media_url // empty' <<< "$resposta")
          if [[ -z "$media_url" ]]; then
            echo "::error::Upload falhou: $resposta"
            exit 1
          fi

          echo "Vídeo enviado: $media_url"
          echo "BS_VIDEO_URL=$media_url" >> "$GITHUB_ENV"

      - name: Executar vistoria no BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BS_APP_URL: ${{ secrets.BS_APP_URL }}
          BS_GPS_LOCATION: "-7.0769,-41.4672"
          # Dispositivo do app. No push/PR usa o padrão abaixo; no "Run workflow"
          # manual dá para escolher outro nos campos de entrada.
          BS_DEVICE: ${{ inputs.bs_device || 'Samsung Galaxy S23' }}
          BS_OS_VERSION: ${{ inputs.bs_os_version || '13.0' }}
        run: |
          set -euo pipefail
          : "${BROWSERSTACK_USERNAME:?Configure o secret BROWSERSTACK_USERNAME}"
          : "${BROWSERSTACK_ACCESS_KEY:?Configure o secret BROWSERSTACK_ACCESS_KEY}"
          : "${BS_APP_URL:?Configure o secret BS_APP_URL}"
          : "${ROBOT_SUITE:?Caminho dos testes vazio}"
          export BROWSERSTACK_USERNAME BROWSERSTACK_ACCESS_KEY BS_APP_URL
          export BS_DEVICE BS_OS_VERSION
          export EXECUCAO=browserstack
          export BS_LOCAL=true
          export BROWSERSTACK_LOCAL_IDENTIFIER="$BS_LOCAL_IDENTIFIER"
          echo "Dispositivo: $BS_DEVICE / Android $BS_OS_VERSION"
          python -m robot -d results "$ROBOT_SUITE"

      - name: Parar túnel BrowserStack Local
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/browserstack-local.pid"
          log_file="$RUNNER_TEMP/browserstack-local.log"

          if [[ -s "$pid_file" ]]; then
            tunnel_pid="$(cat "$pid_file")"
            if kill -0 "$tunnel_pid" 2>/dev/null; then
              kill "$tunnel_pid"
            fi
          fi

          if [[ -s "$log_file" ]]; then
            echo "Últimas linhas do log BrowserStack Local:"
            tail -n 80 "$log_file"
          fi

      - name: Exibir detalhes da sessão BrowserStack
        if: always()
        continue-on-error: true
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -euo pipefail
          builds_url="https://api-cloud.browserstack.com/app-automate/builds.json?limit=100"
          build_id=""

          for attempt in {1..6}; do
            if builds=$(curl --fail --silent --show-error \
              --user "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
              "$builds_url"); then
              build_id=$(jq -r --arg name "$BS_BUILD_NAME" \
                '[.[] | .automation_build | select(.name == $name)][0].hashed_id // empty' \
                <<< "$builds")
              if [[ -n "$build_id" ]]; then
                break
              fi
            fi
            sleep 5
          done

          if [[ -z "$build_id" ]]; then
            echo "::error::Não foi possível localizar o build BrowserStack '$BS_BUILD_NAME'."
            exit 1
          fi

          sessions=$(curl --fail --silent --show-error \
            --user "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            "https://api-cloud.browserstack.com/app-automate/builds/$build_id/sessions.json")
          jq -r '
            .[].automation_session
            | "Sessão: \(.hashed_id)\nStatus: \(.status)\nDispositivo: \(.device) / Android \(.os_version)\nApp: \(.app_details.app_name) \(.app_details.app_version)\nDashboard: \(.browser_url)\n"
          ' <<< "$sessions"

      - name: Remover config/secrets.yaml
        if: always()
        run: rm -f config/secrets.yaml

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/