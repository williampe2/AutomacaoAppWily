name: CI Automacao

on:
  push:
    branches: [ main, master, integration ]
  pull_request:
    branches: [ main, master, integration ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot-tests:
    runs-on: self-hosted
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      BS_LOCAL_IDENTIFIER: ci-${{ github.run_id }}-${{ github.run_attempt }}
      BS_BUILD_NAME: ${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
      BS_SESSION_NAME: login-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar Python
        run: |
          python3 --version
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar estrutura do projeto
        run: |
          python - <<'PY'
          import os
          required = ['config', 'resources', 'tests']
          missing = [p for p in required if not os.path.exists(p)]
          if missing:
              raise SystemExit(f'Pastas ausentes: {missing}')
          print('Estrutura base OK')
          PY

      - name: Diagnóstico de rede do runner
        continue-on-error: true
        env:
          BR_PROXY_HOST: ${{ secrets.BR_PROXY_HOST }}
        run: |
          echo "IP, país e organização de saída do runner:"
          curl -s --max-time 15 https://ipinfo.io/json || echo "Falha ao consultar ipinfo.io"
          echo
          if [[ -n "${BR_PROXY_HOST:-}" ]]; then
            echo "Proxy BR configurado: o túnel vai sair por ele."
          else
            echo "Sem proxy BR: o túnel vai sair pelo IP do runner."
          fi

      - name: Instalar BrowserStack Local
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/browserstack-local"
          archive="$RUNNER_TEMP/browserstack-local.zip"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            https://www.browserstack.com/browserstack-local/BrowserStackLocal-darwin-x64.zip \
            --output "$archive"
          unzip -o "$archive" -d "$install_dir"
          chmod +x "$install_dir/BrowserStackLocal"

      - name: Iniciar túnel BrowserStack Local
        run: |
          set -euo pipefail
          : "${BROWSERSTACK_ACCESS_KEY:?Configure o secret BROWSERSTACK_ACCESS_KEY}"
          tunnel="$RUNNER_TEMP/browserstack-local/BrowserStackLocal"
          log_file="$RUNNER_TEMP/browserstack-local.log"
          pid_file="$RUNNER_TEMP/browserstack-local.pid"

          if [[ ! -x "$tunnel" ]]; then
            echo "BrowserStackLocal não encontrado ou sem permissão de execução: $tunnel" >&2
            exit 1
          fi

          args=(
            --key "$BROWSERSTACK_ACCESS_KEY"
            --local-identifier "$BS_LOCAL_IDENTIFIER"
            --force-local
            --verbose 1
          )

          # Proxy brasileiro opcional (só se os secrets existirem)
          if [[ -n "${BR_PROXY_HOST:-}" && -n "${BR_PROXY_PORT:-}" ]]; then
            args+=(--local-proxy-host "$BR_PROXY_HOST" --local-proxy-port "$BR_PROXY_PORT")
            if [[ -n "${BR_PROXY_USER:-}" ]]; then
              args+=(--local-proxy-user "$BR_PROXY_USER" --local-proxy-pass "$BR_PROXY_PASS")
            fi
            args+=(--force-proxy)
            echo "Túnel usando proxy BR."
          fi

          "$tunnel" "${args[@]}" >"$log_file" 2>&1 &
          tunnel_pid=$!
          printf '%s\n' "$tunnel_pid" > "$pid_file"

          for attempt in {1..30}; do
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              echo "O processo BrowserStackLocal encerrou antes de conectar." >&2
              tail -n 40 "$log_file" >&2 || true
              exit 1
            fi
            if grep -Fq "You can now access your local" "$log_file"; then
              echo "Túnel BrowserStack Local conectado."
              exit 0
            fi
            sleep 1
          done

          echo "Timeout aguardando a conexão do túnel BrowserStack Local." >&2
          tail -n 40 "$log_file" >&2 || true
          exit 1
        env:
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BR_PROXY_HOST: ${{ secrets.BR_PROXY_HOST }}
          BR_PROXY_PORT: ${{ secrets.BR_PROXY_PORT }}
          BR_PROXY_USER: ${{ secrets.BR_PROXY_USER }}
          BR_PROXY_PASS: ${{ secrets.BR_PROXY_PASS }}

      - name: Executar login no BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BS_APP_URL: ${{ secrets.BS_APP_URL }}
          BS_GPS_LOCATION: "-7.0769,-41.4672"
        run: |
          : "${BROWSERSTACK_USERNAME:?Configure o secret BROWSERSTACK_USERNAME}"
          : "${BROWSERSTACK_ACCESS_KEY:?Configure o secret BROWSERSTACK_ACCESS_KEY}"
          : "${BS_APP_URL:?Configure o secret BS_APP_URL}"
          export BROWSERSTACK_USERNAME BROWSERSTACK_ACCESS_KEY BS_APP_URL
          export EXECUCAO=browserstack
          export BS_LOCAL=true
          export BROWSERSTACK_LOCAL_IDENTIFIER="$BS_LOCAL_IDENTIFIER"
          python -m robot -d results tests/mobile/Autenticacao/login.robot

      - name: Parar túnel BrowserStack Local
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/browserstack-local.pid"
          log_file="$RUNNER_TEMP/browserstack-local.log"

          if [[ -s "$pid_file" ]]; then
            tunnel_pid="$(cat "$pid_file")"
            if kill -0 "$tunnel_pid" 2>/dev/null; then
              kill "$tunnel_pid"
            fi
          fi

          if [[ -s "$log_file" ]]; then
            echo "Últimas linhas do log BrowserStack Local:"
            tail -n 80 "$log_file"
          fi

      - name: Exibir detalhes da sessão BrowserStack
        if: always()
        continue-on-error: true
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -euo pipefail
          builds_url="https://api-cloud.browserstack.com/app-automate/builds.json?limit=100"
          build_id=""

          for attempt in {1..6}; do
            if builds=$(curl --fail --silent --show-error \
              --user "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
              "$builds_url"); then
              build_id=$(jq -r --arg name "$BS_BUILD_NAME" \
                '[.[] | .automation_build | select(.name == $name)][0].hashed_id // empty' \
                <<< "$builds")
              if [[ -n "$build_id" ]]; then
                break
              fi
            fi
            sleep 5
          done

          if [[ -z "$build_id" ]]; then
            echo "::error::Não foi possível localizar o build BrowserStack '$BS_BUILD_NAME'."
            exit 1
          fi

          sessions=$(curl --fail --silent --show-error \
            --user "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            "https://api-cloud.browserstack.com/app-automate/builds/$build_id/sessions.json")
          jq -r '
            .[].automation_session
            | "Sessão: \(.hashed_id)\nStatus: \(.status)\nDispositivo: \(.device) / Android \(.os_version)\nApp: \(.app_details.app_name) \(.app_details.app_version)\nDashboard: \(.browser_url)\n"
          ' <<< "$sessions"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/
          