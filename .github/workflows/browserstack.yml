name: Robot Framework - BrowserStack

on:
  push:
    branches: [Integration]
  workflow_dispatch:

jobs:
  browserstack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_APP_ID: bs://43c472b094da76089c1fce234d35f409ca09f4ff

    steps:
      - name: Checkout da branch Integration
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar configuração de execução
        run: |
          mkdir -p config
          cat > config/env_qa.yaml <<'YAML'
          app:
            platform_name: "Android"
            automation_name: "UiAutomator2"
            app_package: "com.wilyapp"
            app_activity: "com.wilyapp.MainActivity"
            device_name: "local-only"
            udid: "local-only"
            no_reset: false
            auto_grant_permissions: true
          YAML

      - name: Validar secrets obrigatórios
        run: |
          test -n "$BROWSERSTACK_USERNAME" || (echo "Secret BROWSERSTACK_USERNAME ausente" && exit 1)
          test -n "$BROWSERSTACK_ACCESS_KEY" || (echo "Secret BROWSERSTACK_ACCESS_KEY ausente" && exit 1)

      - name: Executar smoke test mobile na BrowserStack
        run: |
          robot --outputdir results tests/mobile/BrowserStack/app_launch.robot

      - name: Publicar relatórios Robot Framework
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-browserstack-results
          path: results/
          if-no-files-found: warn
